openapi: '3.0.0'

info:
  title: Blog API
  version: 1.0.0
  description: API for managing blog posts and allow users to signup.

servers:
  - url: http://localhost:8080

tags:
  - name: Posts
    description: For post related operations.
  - name: Auth
    description: For authentication related operations.

paths:
  /auth/signup:
    post:
      tags:
        - Auth
      summary: Register user
      description: Creates a new user account.
      operationId: signup
      requestBody:
        required: true
        description: User signup request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              email: 'user@example.com'
              password: 'password'
      responses:
        '201':
          description: Sign up successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: 'test@test.com'
                role: 'USER'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in and receive a JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
            example:
              email: 'lopez@example.com'
              password: 'Str0ngP@ss'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
              example:
                accessToken: 'wgvedwuoyehbdwiuedbhwbi..'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------- Posts ----------
  /posts:
    get:
      tags:
        - Posts
      summary: Get all posts
      description: Retrieve a list of all blog posts.
      operationId: listPosts
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A list of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

    post:
      tags:
        - Posts
      summary: Create a post
      description: |
        Creates a new post.
        The author is taken from the authenticated user (JWT).
        Requires authentication (JWT).
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreate'
            example:
              title: 'My first post'
              content: 'Hello world'
      responses:
        '201':
          description: The newly created post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /posts/{id}:
    # Shared by every operation under this path (GET, PUT and DELETE)
    parameters:
      - $ref: '#/components/parameters/PostId'

    get:
      tags:
        - Posts
      summary: Get a post by ID
      operationId: getPost
      responses:
        '200':
          description: The requested post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Posts
      summary: Update a post by ID
      description: Update a single blog post by its ID.
      operationId: updatePost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Fields to update for the post. At least one  "title" or "content" must be provided.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdate'
            example:
              title: 'First Post'
              content: 'Content of the first post'
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
              example:
                id: 1
                title: 'First Post'
                content: 'This is the content of the first post'
                createdAt: '2026-04-24T20:30:00Z'
                authorId: 1
        # Defined inline: lists every possible validation error
        '400':
          description: Bad request due to invalid input or invalid ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                  - 'ID must be a positive integer'
                  - 'Title must be at least 3 characters'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Posts
      summary: Delete a post by ID
      description: Delete a single blog post by its ID.
      operationId: deletePost
      security:
        - bearerAuth: []
      responses:
        # 204 has no body, so only a description is needed
        '204':
          description: Post deleted successfully
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PostId:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: integer
        minimum: 1
      example: 1
    SearchParam:
      name: search
      in: query
      required: false
      description: Filter items containing keyword
      schema:
        type: string
      example: 'example'
    SortByParam:
      name: sortBy
      in: query
      required: false
      description: Field to sort results by
      schema:
        type: string
      example: 'createdAt'
    OrderParam:
      name: order
      in: query
      required: false
      description: Sort order, asc or desc
      schema:
        type: string
        enum:
          - asc
          - desc
        default: 'desc'
      example: 'desc'
    OffsetParam:
      name: offset
      in: query
      required: false
      description: Number of items to skip
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return
      schema:
        type: integer
        minimum: 1
        default: 10
      example: 10

  responses:
    BadRequest:
      description: Bad request due to invalid data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorList'
          example:
            errors:
              - 'Email is required'
              - 'Password is required'
    InvalidId:
      description: Invalid ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorList'
          example:
            errors:
              - 'ID must be a positive integer'
    Unauthorized:
      description: Client not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Not authenticated. Please provide a valid token.'
    Forbidden:
      description: Client not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Forbidden: Invalid permission.'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Resource 1 not found'

  schemas:
    Role:
      type: string
      enum:
        - USER
        - ADMIN
      default: 'USER'
      example: 'USER'
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: 'lopez@example.com'
        role:
          $ref: '#/components/schemas/Role'
    SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'lopez@example.com'
        password:
          type: string
          format: password
          minLength: 8
          example: 'Str0ngP@ss'
    Post:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: 'My first post'
        content:
          type: string
          example: 'Hello world'
        authorId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
    PostUpdate:
      type: object
      properties:
        title:
          type: string
          example: 'Updated title'
        content:
          type: string
          example: 'Updated content'
    PostCreate:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          example: 'My first post'
        content:
          type: string
          example: 'Hello world'
    AuthCredentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'lopez@example.com'
        password:
          type: string
          format: password
          example: 'Str0ngP@ss'
    AuthToken:
      type: object
      properties:
        accessToken:
          type: string
          example: 'saudifhsfihneifcwjueocij'
    Error:
      type: object
      properties:
        error:
          type: string
    ErrorList:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
